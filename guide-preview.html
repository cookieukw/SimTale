<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SimTale Guide</title><style>
:root{--ink:#352317;--muted:#806044;--paper:#f3e7cb;--gold:#c78b35;--red:#8d3f3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#15191d;color:var(--ink);font-family:Georgia,serif;overflow:hidden}.stage{width:min(1120px,94vw);height:min(760px,92vh);display:grid;place-items:center;perspective:1400px}.book{position:relative;width:min(980px,94vw);height:min(620px,82vh);display:grid;grid-template-columns:1fr 1fr;filter:drop-shadow(0 28px 22px #0008);transform:rotateX(2deg)}.book:before{content:"";position:absolute;inset:-13px -19px -19px;background:#5a2f25;border:5px solid #3e211d;border-radius:10px;box-shadow:inset 0 0 0 4px #9d6b43;z-index:-2}.book:after{content:"";position:absolute;top:-13px;bottom:-19px;left:50%;width:12px;transform:translateX(-50%);background:#8e6442;box-shadow:0 0 12px #382019;z-index:5}.page{position:relative;background:var(--paper);padding:54px 58px 74px;overflow:hidden;box-shadow:inset 0 0 50px #9c754522}.page:first-child{border-radius:5px 0 0 5px}.page:nth-child(2){border-radius:0 5px 5px 0}.page:before{content:"";position:absolute;inset:18px;border:1px solid #b99668;opacity:.55}.page:after{content:"";position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 5px,#9e7849 6px 7px)}.content{position:relative;z-index:1}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font:700 12px/1.2 system-ui;color:var(--red);margin-bottom:16px}.title{font-size:clamp(30px,4vw,53px);line-height:.98;margin:0 0 18px;color:#2b1b14}.body{font-size:18px;line-height:1.55;max-width:38ch}.rule{height:2px;width:90px;background:var(--gold);margin:20px 0}.folio{position:absolute;bottom:28px;font:700 12px system-ui;letter-spacing:.12em;color:var(--muted);z-index:1}.page:first-child .folio{left:58px}.page:nth-child(2) .folio{right:58px}.nav{position:absolute;bottom:25px;right:48px;display:flex;gap:8px;z-index:3}.btn{border:1px solid #9c754b;background:#e0c291;color:#3b2418;border-radius:3px;padding:10px 14px;font:700 13px system-ui;cursor:pointer}.btn:hover{background:var(--gold);color:#fff4df}.btn:disabled{opacity:.35;cursor:default}.toc{position:absolute;inset:0;background:#291b16dd;display:grid;place-items:center;z-index:20;opacity:0;pointer-events:none;transition:.2s}.toc.open{opacity:1;pointer-events:auto}.toc-card{width:min(470px,86vw);background:var(--paper);padding:34px;border:6px solid #6b422e;box-shadow:0 20px 50px #0009}.toc h2{margin:0 0 18px;font-size:30px}.close-toc{float:right;background:none;border:0;font-size:24px;cursor:pointer;color:var(--red)}.chapter-list{display:grid;gap:10px}.chapter{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--ink);text-align:left;font:600 17px Georgia;cursor:pointer;padding:7px}.chapter:hover{color:var(--red)}.chapter b{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--gold);border-radius:50%;font:700 13px system-ui;color:var(--red)}.turn{animation:turn .42s ease}@keyframes turn{50%{transform:rotateY(7deg);opacity:.45}100%{transform:none;opacity:1}}.hint{position:fixed;bottom:18px;color:#d5c8b6;font:12px system-ui;opacity:.7}@media(max-width:720px){.book{height:680px;grid-template-columns:1fr}.page:nth-child(2){display:none}.book:after{display:none}.page{padding:42px 34px 74px}.page:first-child .folio{left:34px}.nav{right:28px}}
</style></head><body><main class="stage"><section class="book" aria-label="SimTale Guide"><article class="page"><div class="content" id="left"></div><div class="folio" id="fl"></div></article><article class="page"><div class="content" id="right"></div><div class="folio" id="fr"></div><nav class="nav"><button class="btn" id="prev">Anterior</button><button class="btn" id="tocBtn">Índice</button><button class="btn" id="next">Próxima</button></nav></article><div class="toc" id="toc"><div class="toc-card"><button class="close-toc">×</button><h2>Índice</h2><div class="chapter-list" id="chapters"></div></div></div></section></main><div class="hint">← → navega · I abre o índice · Esc fecha o índice</div><script>
const pages=[['Bem-vindo','SimTale transforma um assentamento em uma vila viva. Convide moradores, construa casas e descubra como necessidades, empregos e relações formam cada dia.','Comece pela vila','Faça um Contrato de Imigração, use-o para convidar um residente, coloque uma cama e construa um cômodo fechado ao redor dela.'],['Casas e camas','Uma cama registrada é a âncora de uma casa. O formato do cômodo, os móveis e os baús próximos definem como o NPC vai viver.','Confira antes de avançar','Use o Projeto de Casa em uma cama registrada. Ele informa o que falta e ilumina o chão do cômodo por alguns segundos.'],['Vida dos NPCs','Fome, Energia, Higiene, Diversão e Social moldam o comportamento. Necessidades baixas podem interromper trabalho, conversa ou lazer.','Relações importam','Converse, conte piadas, flerte e dê presentes. Humor, traços, profissão e amizade mudam as respostas.'],['Profissões e hobbies','Atribua trabalhos pelo painel de interação. Fazendeiros, pescadores, mineradores e lenhadores usam postos e levam recursos para os baús.','Deixe a vila respirar','Seguidores usam pathfinding nativo. Hobbies aparecem quando a Diversão está baixa e existem móveis marcados por perto.'],['Ferramentas da vila','O Livro do Estalajadeiro lista camas. A Lupa do Intendente lista baús. O Diário do Inspetor mostra necessidades, humor, emprego e rotina.','Itens especiais','O Sino chama moradores para casa. O Bolo celebra um NPC. O Porquinho guarda moedas para o mercador.'],['Segurança e comércio','Moradores dentro dos limites da vila ficam protegidos contra dano normal. Guardas defendem o assentamento e civis procuram abrigo.','O mercador viajante','Ele visita por cerca de trinta minutos. Identidade, especialidade e estoque ficam salvos. Compre, venda e deixe o Porquinho completar o cobre.']];let page=0;const prev=document.querySelector('#prev'),next=document.querySelector('#next'),toc=document.querySelector('#toc');function render(){const p=pages[page];document.querySelector('#left').innerHTML='<h1 class="title">'+p[0]+'</h1><div class="rule"></div><p class="body">'+p[1]+'</p>';document.querySelector('#right').innerHTML='<h2 class="title" style="font-size:32px">'+p[2]+'</h2><p class="body">'+p[3]+'</p>';document.querySelector('#fl').textContent=String(page*2+1).padStart(2,'0');document.querySelector('#fr').textContent=String(page*2+2).padStart(2,'0');prev.disabled=!page;next.disabled=page===pages.length-1;document.querySelectorAll('.page').forEach(x=>{x.classList.remove('turn');void x.offsetWidth;x.classList.add('turn')})}prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if(page<pages.length-1){page++;render()}};document.querySelector('#tocBtn').onclick=()=>toc.classList.add('open');document.querySelector('.close-toc').onclick=()=>toc.classList.remove('open');document.querySelector('#chapters').innerHTML=pages.map((p,i)=>'<button class="chapter" data-p="'+i+'"><b>'+(i+1)+'</b>'+p[0]+'</button>').join('');document.querySelectorAll('.chapter').forEach(b=>b.onclick=()=>{page=+b.dataset.p;toc.classList.remove('open');render()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click();if(e.key.toLowerCase()==='i')toc.classList.add('open');if(e.key==='Escape')toc.classList.remove('open')});render();
</script></body></html>
