plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

ext {
    // Tenta ler do local.properties, se não existir usa o padrão Linux
    def localProps = new Properties()
    def localPropsFile = project.rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localProps.load(localPropsFile.newDataInputStream())
    }
    
    hytaleHome = localProps.getProperty('hytale.dir') ?: 
                 (System.getProperty("os.name").toLowerCase().contains("win") 
                    ? "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
                    : "${System.getProperty("user.home")}/.local/share/hytale")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

sourceSets {
    test {
        java {
            srcDirs = ['tests']
        }
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation sourceSets.main.output
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.register('runTests', JavaExec) {
    dependsOn 'compileTestJava'
    mainClass = 'com.cookieukw.SimTale.tests.SimTaleTests'
    classpath = sourceSets.test.runtimeClasspath
}

// Tarefa de deploy
//
// Copia ATOMICA, e isso importa. A versao anterior era um `Copy` do Gradle, que escreve o jar
// direto por cima de Mods/SimTale-x.y.z.jar. Como o Hytale observa essa pasta e recarrega o mod
// sozinho quando o arquivo muda, ele disparava a recarga assim que a escrita comecava e lia um
// jar pela metade. O sintoma era:
//
//   FAIL: /Server/NPC/Roles/SimTale_Human_Male.json: Failed to load builder:
//   java.util.zip.ZipException: invalid LOC header (bad signature)
//
// seguido de "Reloading nonexistent role ..." para cada role gerado, porque os roles base nunca
// chegaram a entrar no registro. O jar em disco estava intacto o tempo todo — o problema era
// puramente o instante da leitura. Com 11 MB de mod, a janela de corrupcao e larga.
//
// Escrever num arquivo temporario na MESMA pasta e depois renomear resolve: no mesmo sistema de
// arquivos, o rename e atomico. O jogo ou ve o jar antigo inteiro, ou o novo inteiro. Nunca um
// meio-termo.
tasks.register('deploy') {
    dependsOn 'jar'

    def jarFile = tasks.jar.archiveFile
    def targetDir = file("${hytaleHome}/Mods")

    inputs.file(jarFile)
    // Sem outputs declarados o Gradle nao consegue avaliar atualidade, e `inputs` sozinho nao
    // significa nada. Copiar sempre e o comportamento correto aqui: o alvo esta fora do projeto e
    // pode ter sido substituido por fora.
    outputs.upToDateWhen { false }

    doLast {
        if (!file(hytaleHome).exists()) {
            println "AVISO: Pasta do Hytale não encontrada em: $hytaleHome"
            println "Configure 'hytale.dir=/caminho/certo' no seu local.properties"
            return
        }
        targetDir.mkdirs()

        def source = jarFile.get().asFile
        def target = new File(targetDir, source.name)
        // O temporario precisa ficar na mesma pasta do destino, senao o rename cruza sistemas
        // de arquivos e deixa de ser atomico (ATOMIC_MOVE lanca excecao nesse caso).
        //
        // O nome NAO pode conter ".jar": o observador da pasta Mods pode casar por substring, e
        // ai ele tentaria carregar o temporario enquanto ele ainda esta sendo escrito — que e
        // exatamente o problema que a copia atomica existe para evitar. O ponto inicial tambem o
        // deixa oculto no Linux.
        def temp = new File(targetDir, "." + source.name.replace(".jar", "") + ".deploy.tmp")

        try {
            java.nio.file.Files.copy(source.toPath(), temp.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            java.nio.file.Files.move(temp.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                    java.nio.file.StandardCopyOption.ATOMIC_MOVE)
            println "Deploy: ${target}"
        } catch (Exception e) {
            temp.delete()
            throw e
        }
    }
}

// NAO usar tasks.jar.finalizedBy('deploy').
//
// Com finalizedBy, QUALQUER tarefa que produza o jar dispara um deploy: `build`, `assemble`, a
// sincronizacao do IDE, o sources jar. O Hytale observa a pasta Mods e recarrega o mod sozinho
// quando o arquivo muda, entao o jogo era recarregado em momentos que nao correspondiam a nenhuma
// acao consciente — e testar logo depois pegava o mod em estado inconsistente.
//
// Como `deploy` ja declara dependsOn 'jar', `./gradlew deploy` continua compilando e copiando.
// A diferenca e que agora `./gradlew build` NAO mexe na instalacao do jogo.

tasks.named("jar") {
    destinationDirectory.set(file("$projectDir/build/libs"))
}
