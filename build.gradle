import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

ext {
    def localProps = new Properties()
    def localPropsFile = project.rootProject.file('local.properties')

    if (localPropsFile.exists()) {
        localProps.load(localPropsFile.newDataInputStream())
    }

    hytaleHome = localProps.getProperty('hytale.dir') ?:
        (System.getProperty("os.name").toLowerCase().contains("win")
            ? "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
            : "${System.getProperty("user.home")}/.local/share/hytale")
}

def manifestFile = file("$projectDir/src/main/resources/manifest.json")
def manifestData = new groovy.json.JsonSlurper().parse(manifestFile)
def modVersion = manifestData.Version.toString()

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}

sourceSets {
    test {
        java {
            srcDirs = ['tests']
        }
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation sourceSets.main.output
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.register('runTests', JavaExec) {
    dependsOn 'compileTestJava'
    mainClass = 'com.cookieukw.SimTale.tests.SimTaleTests'
    classpath = sourceSets.test.runtimeClasspath
}

test {
    failOnNoDiscoveredTests = false
}

tasks.register('checkUi', Exec) {
    group = 'verification'
    description = 'Valida caminhos, chaves de traducao e sintaxe dos arquivos .ui'

    def script = file("$projectDir/tools/check_ui.py")
    onlyIf { script.exists() }

    commandLine 'python3', script.absolutePath

    def assetsDir = System.getenv('HYTALE_ASSETS')

    if (assetsDir == null) {
        def props = new Properties()
        def f = project.rootProject.file('local.properties')

        if (f.exists()) {
            props.load(f.newDataInputStream())
            assetsDir = props.getProperty('hytale.assets')
        }
    }

    if (assetsDir != null) {
        environment 'HYTALE_ASSETS', assetsDir
    }
}

tasks.register('checkLocales', Exec) {
    group = 'verification'
    description = 'Valida completude, placeholders e sintaxe dos arquivos .lang'

    def script = file("$projectDir/tools/check_locales.py")
    onlyIf { script.exists() }

    commandLine 'python3', script.absolutePath
}

tasks.register('checkLocalesStrict', Exec) {
    group = 'verification'
    description = 'Valida os .lang e falha se faltar alguma chave do en-US'

    def script = file("$projectDir/tools/check_locales.py")
    onlyIf { script.exists() }

    commandLine 'python3', script.absolutePath, '--strict'
}

tasks.register('syncCosmetics') {
    doLast {
        def localProps = new Properties()
        def localPropsFile = project.rootProject.file('local.properties')
        def assetsDir = null

        if (localPropsFile.exists()) {
            localProps.load(localPropsFile.newDataInputStream())
            assetsDir = localProps.getProperty('hytale.assets')
        }

        if (assetsDir == null) {
            assetsDir = System.getenv('HYTALE_ASSETS')
        }

        if (assetsDir != null) {
            def srcDir = file("${assetsDir}/Common/Cosmetics")
            def destDir = file("$projectDir/src/main/resources/Common/Cosmetics")

            if (srcDir.exists()) {
                destDir.mkdirs()

                srcDir.toPath().toFile().eachFileRecurse { file ->
                    if (file.isFile()) {
                        def relativePath = srcDir.toPath().relativize(file.toPath())
                        def targetFile = new File(destDir, relativePath.toString())
                        targetFile.parentFile.mkdirs()
                        try {
                            java.nio.file.Files.copy(
                                file.toPath(),
                                targetFile.toPath(),
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING
                            )
                        } catch (Exception e) {
                            println "Aviso ao copiar ${file.name}: ${e.message}"
                        }
                    }
                }
                println "Cosméticos sincronizados com sucesso."
            } else {
                println "AVISO: Pasta de assets Cosmetics não encontrada em ${srcDir}"
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn 'syncCosmetics'
    dependsOn 'checkUi'
    dependsOn 'checkLocales'
}

tasks.register('deploy') {
    dependsOn 'jar'

    def jarFile = tasks.jar.archiveFile
    def targetDir = file("${hytaleHome}/Mods")

    inputs.file(jarFile)
    outputs.upToDateWhen { false }

    doLast {
        if (!file(hytaleHome).exists()) {
            println "AVISO: Pasta do Hytale não encontrada em: $hytaleHome"
            println "Configure 'hytale.dir=/caminho/certo' no seu local.properties"
            return
        }

        targetDir.mkdirs()

        def source = jarFile.get().asFile
        def target = new File(targetDir, source.name)
        def temp = new File(
            targetDir,
            "." + source.name.replace(".jar", "") + ".deploy.tmp"
        )

        try {
            Files.copy(
                source.toPath(),
                temp.toPath(),
                StandardCopyOption.REPLACE_EXISTING
            )

            Files.move(
                temp.toPath(),
                target.toPath(),
                StandardCopyOption.REPLACE_EXISTING,
                StandardCopyOption.ATOMIC_MOVE
            )

            println "Deploy: ${target}"
        } catch (Exception e) {
            temp.delete()
            throw e
        }
    }
}

tasks.named("jar") {
    archiveBaseName.set("SimTale")
    archiveVersion.set(modVersion)
    destinationDirectory.set(file("$projectDir/build/libs"))
}