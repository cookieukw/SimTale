<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="giftBox" x1="4" y1="9" x2="20" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9d4edd"/>
      <stop offset="1" stop-color="#5a189a"/>
    </linearGradient>
    <linearGradient id="giftRibbon" x1="10" y1="2" x2="14" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe66d"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
  </defs>
  <!-- Box Body -->
  <rect x="4" y="9" width="16" height="12" rx="2" fill="url(#giftBox)"/>
  <!-- Lid -->
  <rect x="3" y="6" width="18" height="4" rx="1.5" fill="#7b2cbf"/>
  <!-- Vertical Ribbon -->
  <rect x="10.5" y="6" width="3" height="15" fill="url(#giftRibbon)"/>
  <!-- Horizontal Ribbon Lid -->
  <rect x="3" y="7.3" width="18" height="1.4" fill="url(#giftRibbon)" opacity="0.6"/>
  <!-- Bow Loops -->
  <path d="M12 6c-1.6-3-5.2-3-5.2-.4S10.2 6 12 6z" fill="url(#giftRibbon)"/>
  <path d="M12 6c1.6-3 5.2-3 5.2-.4S13.8 6 12 6z" fill="url(#giftRibbon)"/>
  <!-- Center Knot -->
  <circle cx="12" cy="6" r="1.3" fill="#fb8500"/>
  <!-- Sparkle on Box -->
  <circle cx="6.5" cy="11.5" r="0.7" fill="#ffffff" opacity="0.6"/>
</svg>
