# Configuração do projeto Crowdin.
# A fonte é en-US; o Crowdin edita os locales de destino e a GitHub Action
# abre um PR contra a branch atual de release (feat/1.3.1 por enquanto).
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true

files:
  - source: /src/main/resources/Server/Languages/en-US/*.lang
    # O Crowdin identifica o formato pela extensão. .lang não é uma extensão
    # conhecida, então ele vê o arquivo como .properties; no repositório o
    # arquivo continua .lang.
    dest: /src/main/resources/Server/Languages/en-US/%file_name%.properties
    translation: /src/main/resources/Server/Languages/%locale%/%file_name%.lang
    type: properties
    # O parser do Hytale não precisa do escape de Java Properties para estes
    # caracteres, e o escape padrão sujaria os textos com barras invertidas.
    escape_quotes: 0
    escape_special_characters: 0
    # Preserva traduções existentes quando o texto em inglês muda; elas voltam
    # para a fila de revisão em vez de serem perdidas silenciosamente.
    update_option: update_as_unapproved
