name: i18n

# Validates the .lang in every PR that touches translations. Missing keys are
# fatal: Crowdin exports only translated strings, so a bot PR that drops a key
# must be fixed (or the key restored) before it can be merged. Extra, duplicate,
# empty, or altered-placeholder keys also break the job.
on:
  pull_request:
    paths:
      - 'src/main/resources/Server/Languages/**'
      - 'tools/check_ui.py'
      - 'tools/check_locales.py'
      - 'tools/merge_crowdin_keys.py'
      - '.github/workflows/i18n.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/resources/Server/Languages/**'
      - 'tools/check_ui.py'
      - 'tools/check_locales.py'
      - 'tools/merge_crowdin_keys.py'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate UI keys
        run: python3 tools/check_ui.py

      - name: Validate locale parity
        run: python3 tools/check_locales.py --strict
