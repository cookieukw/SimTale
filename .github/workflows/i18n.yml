name: i18n

# Valida os .lang em todo PR que mexe em traduções. O Crowdin pode exportar
# apenas as strings traduzidas, então chaves faltantes são avisos; chaves
# extras, duplicadas, vazias ou com placeholders alterados quebram o job.
on:
  pull_request:
    paths:
      - 'src/main/resources/Server/Languages/**'
      - 'tools/check_ui.py'
      - 'tools/check_locales.py'
      - '.github/workflows/i18n.yml'
  push:
    branches: [feat/1.3.1]
    paths:
      - 'src/main/resources/Server/Languages/**'
      - 'tools/check_ui.py'
      - 'tools/check_locales.py'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate UI keys
        run: python3 tools/check_ui.py

      - name: Validate locale parity
        run: python3 tools/check_locales.py
