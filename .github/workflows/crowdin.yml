name: Crowdin

# Syncs en-US with Crowdin and opens a PR with the translations.
# The push trigger is intentionally only on en-US: the commit that adds this
# workflow should not start a sync before the manual seed of pt-BR/es-ES.
on:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/Server/Languages/en-US/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_title: 'i18n: update translations'
          pull_request_body: 'Traduções sincronizadas pelo Crowdin.'
          pull_request_base_branch_name: 'main'
          pull_request_labels: 'i18n, crowdin'
          skip_untranslated_strings: true
          skip_untranslated_files: true
          commit_message: 'i18n: import Crowdin translations'
          # export_only_approved: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
