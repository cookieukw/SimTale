name: Crowdin

# Syncs en-US with Crowdin and opens a PR with the translations.
# The push trigger is intentionally only on en-US: the commit that adds this
# workflow should not start a sync before the manual seed of pt-BR/es-ES.
on:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/Server/Languages/en-US/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_title: 'i18n: update translations'
          pull_request_body: 'Synced translations from Crowdin.'
          pull_request_base_branch_name: 'main'
          pull_request_labels: 'i18n, crowdin'
          skip_untranslated_strings: true
          skip_untranslated_files: false
          commit_message: 'i18n: import Crowdin translations'
          # export_only_approved: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # skip_untranslated_strings drops every key that has no translation in
      # Crowdin yet. Those keys still exist in the repository (usually as the
      # fallback translation added together with a feature), so a plain download
      # would delete them from the bot PR. Restore only what the download
      # omitted; translations that Crowdin did provide are left untouched.
      - name: Restore keys that Crowdin has not translated yet
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin l10n_crowdin >/dev/null 2>&1; then
            echo "No Crowdin branch was created; nothing to restore."
            exit 0
          fi
          if [ "$(git branch --show-current)" != "l10n_crowdin" ]; then
            git fetch origin l10n_crowdin
            git checkout -B l10n_crowdin origin/l10n_crowdin
          fi
          python3 tools/merge_crowdin_keys.py --base origin/main
          if git diff --quiet; then
            echo "No missing keys; nothing to restore."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/Server/Languages
          git commit -m "i18n: keep untranslated fallback keys"
          git push origin HEAD:l10n_crowdin
