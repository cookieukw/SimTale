<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <!-- Cover Gradient -->
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1e12"/>
      <stop offset="48%" stop-color="#3b2b1a"/>
      <stop offset="50%" stop-color="#1c130b"/>
      <stop offset="52%" stop-color="#3b2b1a"/>
      <stop offset="100%" stop-color="#2a1e12"/>
    </linearGradient>

    <!-- Page Gradient (Lighting) -->
    <linearGradient id="pageGradLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2ebd9"/>
      <stop offset="90%" stop-color="#e8deb5"/>
      <stop offset="100%" stop-color="#c2b58c"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2b58c"/>
      <stop offset="10%" stop-color="#e8deb5"/>
      <stop offset="100%" stop-color="#f2ebd9"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Book Cover -->
  <rect x="10" y="10" width="780" height="530" rx="15" ry="15" fill="url(#coverGrad)" filter="url(#shadow)"/>
  
  <!-- Cover Borders / Details -->
  <rect x="20" y="20" width="760" height="510" rx="10" ry="10" fill="none" stroke="#52391e" stroke-width="4"/>
  <line x1="400" y1="10" x2="400" y2="540" stroke="#1c130b" stroke-width="8"/>

  <!-- Left Page -->
  <path d="M 30 40 Q 200 30 395 40 L 395 510 Q 200 520 30 510 Z" fill="url(#pageGradLeft)" filter="url(#shadow)"/>
  
  <!-- Right Page -->
  <path d="M 770 40 Q 600 30 405 40 L 405 510 Q 600 520 770 510 Z" fill="url(#pageGradRight)" filter="url(#shadow)"/>
  
  <!-- Center fold shadow -->
  <rect x="395" y="40" width="10" height="470" fill="#a39673" opacity="0.6"/>
</svg>
