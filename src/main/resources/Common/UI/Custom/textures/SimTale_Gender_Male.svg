<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
      <defs>
        <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1C2330"/>
          <stop offset="100%" stop-color="#0F131A"/>
        </linearGradient>
        <linearGradient id="silverRim" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="60%" stop-color="#E2E8F0"/>
          <stop offset="100%" stop-color="#94A3B8"/>
        </linearGradient>
      </defs>

      <!-- Full Medallion Coin Frame -->
      <circle cx="48" cy="48" r="42" fill="url(#coinGrad)" stroke="url(#silverRim)" stroke-width="3"/>
      <circle cx="48" cy="48" r="37.5" fill="none" stroke="#475569" stroke-width="1.5"/>

      <!-- Mars Heraldry in Pure White / Silver -->
      <circle cx="44" cy="52" r="14" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <line x1="54" y1="42" x2="66" y2="30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <polyline points="55,30 66,30 66,41" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Center Diamond Rune -->
      <polygon points="44,48 47,52 44,56 41,52" fill="#FFFFFF"/>
    </svg>